services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcart
      POSTGRES_USER: smartcart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcart_local}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "pip install -q -r requirements.txt && cd backend && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://smartcart:${POSTGRES_PASSWORD:-smartcart_local}@db:5432/smartcart
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]

  web:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes: [".:/app"]
    command: sh -c "npm install && npx vite --host 0.0.0.0"
    environment:
      FRONTEND_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
