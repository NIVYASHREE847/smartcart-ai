services:
  - type: web
    name: smartcart-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # DATABASE_URL is optional. Without it the API uses SQLite, which is re-seeded from the CSVs on every
      # restart/redeploy (app-created users and orders are not kept). For persistence, add DATABASE_URL in the
      # Render dashboard (Supabase or an existing Render Postgres connection string).
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://smartcart-ai-woad.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: USE_EMBEDDINGS
        value: "0"
